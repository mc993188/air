<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>多城市空气质量动态分析大屏</title>
  <!-- 本地引入 ECharts -->
  <script src="./node_modules/echarts/dist/echarts.min.js"></script>
  <!-- 引入 Axios 用于请求 -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #03081a;
      background-image: linear-gradient(rgba(0, 210, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 210, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      color: #fff;
      font-family: 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      padding-bottom: 30px;
      overflow-x: hidden;
    }
    /* 顶部标题栏 */
    .header {
      height: 80px;
      text-align: center;
      line-height: 80px;
      font-size: 32px;
      font-weight: bold;
      color: #00d2ff;
      text-shadow: 0 0 15px #00d2ff;
      background: rgba(0,0,0,0.5);
      border-bottom: 2px solid rgba(0,210,255,0.3);
      margin-bottom: 20px;
    }

    .container { max-width: 1800px; margin: 0 auto; padding: 0 20px; }

    /* 统一布局类 */
    .row { display: flex; gap: 20px; margin-bottom: 20px; }

    .chart-card {
      flex: 1;
      height: 420px;
      background: rgba(10, 20, 40, 0.7);
      border: 1px solid #1a3652;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.1) inset;
    }

    /* 卡片顶栏：左侧标题，右侧控件 */
    .card-header {
      height: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid rgba(26, 54, 82, 0.5);
      flex-shrink: 0;
    }
    .card-title { font-size: 18px; font-weight: bold; color: #fff; }

    /* 雷达图下拉框美化 */
    .tech-select {
      background: #0b1a30;
      color: #00d2ff;
      border: 1px solid #00d2ff;
      padding: 6px 30px 6px 12px;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      font-size: 14px;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300d2ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 14px;
    }
    /* 🌟 重置按钮样式 */
    .tech-btn {
      background: transparent;
      color: #00d2ff;
      border: 1px solid #00d2ff;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.3s ease;
    }
    .tech-btn:hover {
      background: rgba(0, 210, 255, 0.2);
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
      color: #fff;
    }
    .tech-select:hover { background-color: #1a3652; }

    /* 图表容器自适应 */
    .chart-container { flex: 1; width: 100%; }
  </style>
</head>
<body>
<div class="header">多城市空气质量动态分析大屏</div>

<!-- 第一行：中国地图 -->
<div class="row">
  <div class="chart-card" style="flex: 1; height: 560px;">
    <div class="card-header">
      <div class="card-title">21 城市空气质量地图分布</div>
      <span style="font-size:12px; color:#88c0d0;">颜色越深 AQI 越高，滚轮可缩放地图</span>
    </div>
    <div id="mapChart" class="chart-container"></div>
  </div>
</div>
<div class="container">

  <div class="row">
    <!-- 排名图 -->
    <div class="chart-card">
      <div class="card-header">
        <div class="card-title">各城市平均 AQI 排名</div>
      </div>
      <div id="rankChart" class="chart-container"></div>
    </div>

    <!-- 折线图 -->
    <div class="chart-card">
      <div class="card-header">
        <div class="card-title">多城市 24 小时 AQI 对比</div>
        <span style="font-size:12px; color:#88c0d0;">提示：点击上方图例可切换城市</span>
        <button id="resetTrendBtn" class="tech-btn">一键重置</button>
      </div>
      <div id="trendChart" class="chart-container"></div>
    </div>
  </div>

  <!-- 第二行 -->
  <div class="row">
    <!-- 雷达图 -->
    <div class="chart-card">
      <div class="card-header">
        <div class="card-title">污染物浓度特征雷达</div>
        <select id="radarSelect" class="tech-select"></select>
      </div>
      <div id="radarChart" class="chart-container"></div>
    </div>

    <!-- 柱线组合图 -->
    <div class="chart-card">
      <div class="card-header">
        <div class="card-title">重点污染城市 AQI 与优良率</div>
      </div>
      <div id="compareChart" class="chart-container"></div>
    </div>
  </div>

  <!-- 第三行：左饼图 + 右动态演化图 -->
  <div class="row">
    <!-- 左侧嵌套饼图 (占 4) -->
    <div class="chart-card" style="flex: 4; height: 500px;">
      <div class="card-header">
        <div class="card-title">21 城市优良时段占比嵌套分析</div>
        <span style="font-size:12px; color:#88c0d0;">自动轮播中...</span>
      </div>
      <div id="ratioChart" class="chart-container"></div>
    </div>

    <!-- 右侧堆叠演化图 (占 6) -->
    <div class="chart-card" style="flex: 6; height: 500px;">
      <div class="card-header">
        <div class="card-title">城市空气质量等级 24 小时演化趋势</div>
        <span style="font-size:12px; color:#88c0d0;">提示：面积越高，污染城市越多</span>
      </div>
      <div id="levelChart" class="chart-container"></div>
    </div>
  </div>
</div>

<script>
  // ================== 全局变量与初始化 ==================
  var mapChart = echarts.init(document.getElementById('mapChart'));
  var rankChart = echarts.init(document.getElementById('rankChart'));
  var trendChart = echarts.init(document.getElementById('trendChart'));
  var radarChart = echarts.init(document.getElementById('radarChart'));
  var compareChart = echarts.init(document.getElementById('compareChart'));
  var ratioChart = echarts.init(document.getElementById('ratioChart'));
  var levelChart = echarts.init(document.getElementById('levelChart'));

  var textColor = '#88c0d0';
  var allCitiesStr = '';
  var pieTimer = null;
  var chinaMapRegistered = false;
  var globalCityList = [];
  var defaultTrendSelected = {};

  // 21 个城市经纬度，用于地图打点
  var cityCoord = {
    '北京': [116.40, 39.90],
    '天津': [117.20, 39.12],
    '石家庄': [114.51, 38.04],
    '唐山': [118.18, 39.63],
    '秦皇岛': [119.60, 39.94],
    '邯郸': [114.49, 36.61],
    '保定': [115.46, 38.87],
    '张家口': [114.88, 40.82],
    '承德': [117.96, 40.95],
    '廊坊': [116.68, 39.52],
    '沧州': [116.83, 38.30],
    '衡水': [115.67, 37.74],
    '邢台': [114.50, 37.07],
    '太原': [112.55, 37.87],
    '呼和浩特': [111.67, 40.82],
    '沈阳': [123.43, 41.80],
    '大连': [121.62, 38.91],
    '长春': [125.32, 43.82],
    '哈尔滨': [126.53, 45.80],
    '上海': [121.47, 31.23],
    '南京': [118.80, 32.06]
  };

  // ================== 主请求流程 ==================
  axios.get('/api/air/dashboard').then(function (response) {
    var data = response.data;
    allCitiesStr = data.cityList.join(',');

    // 1. 渲染中国地图
    renderMapChart(data.ranking);

    // 2. 渲染排名图
    renderRankChart(data.ranking);

    // 3. 渲染对比图
    renderCompareChart(data.ranking, data.ratio);

    // 4. 初始化雷达图下拉框
    initRadarSelect(data.cityList);

    // 5. 获取全量趋势数据
    axios.get('/api/air/trend?cities=' + allCitiesStr).then(function (res) {
      var trendData = res.data;
      renderTrendChart(trendData, data.cityList);
      renderLevelChart(trendData);
    });

    // 6. 渲染嵌套饼图
    renderNestedPie(data.ratio);

  }).catch(function (err) {
    console.error('数据加载失败', err);
    alert('数据加载失败，请按 F12 查看控制台');
  });
  //一键重置按钮事件
  document.getElementById('resetTrendBtn').addEventListener('click', function () {
    if (globalCityList.length === 0) return; // 数据还没加载完不执行

    // 深拷贝一份默认配置
    var resetSelected = JSON.parse(JSON.stringify(defaultTrendSelected));

    // 通过重新设置 legend.selected 来强制重置图例状态
    trendChart.setOption({
      legend: {
        selected: resetSelected
      }
    });

    // 可选：重置后提示一下
    console.log('折线图已重置为默认状态');
  });

  // ================== 地图 ==================
  function getAqiColor(aqi) {
    if (aqi <= 50) return '#00ff88';
    if (aqi <= 100) return '#ffb703';
    if (aqi <= 150) return '#ff9800';
    if (aqi <= 200) return '#ff4d4d';
    return '#a20b0b';
  }

  function renderMapChart(ranking) {
    var mapData = [];
    ranking.forEach(function (item) {
      var coord = cityCoord[item.city];
      if (coord) {
        mapData.push({
          name: item.city,
          value: [coord[0], coord[1], item.avgAqi]
        });
      }
    });

    if (chinaMapRegistered) {
      mapChart.setOption(buildMapOption(mapData), true);
      return;
    }

    axios.get('./china.json').then(function (res) {
      echarts.registerMap('china', res.data);
      chinaMapRegistered = true;
      mapChart.setOption(buildMapOption(mapData), true);
    }).catch(function (err) {
      console.error('中国地图数据加载失败，请确认 china.json 是否在页面同目录', err);
    });
  }

  function buildMapOption(mapData) {
    var option = {
      tooltip: {
        trigger: 'item',
        formatter: function (params) {
          if (params.seriesType === 'scatter') {
            return params.name + '<br/>平均 AQI：<strong>' + params.value[2] + '</strong>';
          }
          return params.name;
        }
      },
      geo: {
        map: 'china',
        roam: true,
        zoom: 1.2,
        label: { show: false },
        itemStyle: {
          areaColor: '#0b1a30',
          borderColor: '#1a3652',
          borderWidth: 1
        },
        emphasis: {
          itemStyle: { areaColor: '#1a3652' },
          label: { show: false }
        }
      },
      series: [
        {
          name: '城市平均 AQI',
          type: 'scatter',
          coordinateSystem: 'geo',
          data: mapData,
          symbolSize: function (val) {
            return Math.max(8, Math.min(28, val[2] / 8));
          },
          itemStyle: {
            color: function (params) {
              return getAqiColor(params.value[2]);
            },
            shadowBlur: 10,
            shadowColor: 'rgba(0, 210, 255, 0.5)'
          },
          label: {
            show: true,
            formatter: '{b}',
            position: 'right',
            color: '#fff',
            fontSize: 11
          },
          labelLayout: { hideOverlap: true },
          emphasis: {
            label: { show: true, color: '#00d2ff' }
          }
        }
      ]
    };
    return option;
  }

  // ================== 左上：城市排名 ==================
  function renderRankChart(ranking) {
    var cities = ranking.map(function (item) { return item.city; }).reverse();
    var values = ranking.map(function (item) { return item.avgAqi; }).reverse();

    var option = {
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      grid: { left: '3%', right: '8%', bottom: '5%', top: '5%', containLabel: true },
      xAxis: {
        type: 'value',
        axisLabel: { color: textColor },
        splitLine: { show: false }
      },
      yAxis: {
        type: 'category',
        data: cities,
        axisLabel: { color: textColor, fontSize: 11 }
      },
      series: [
        {
          type: 'bar',
          data: values,
          itemStyle: {
            color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
              { offset: 0, color: '#00d2ff' },
              { offset: 1, color: '#ff4d4d' }
            ]),
            borderRadius: [0, 5, 5, 0]
          },
          label: { show: true, position: 'right', color: '#fff' }
        }
      ]
    };
    rankChart.setOption(option);
  }

  // ================== 中上：多城市折线趋势 ==================
  function renderTrendChart(trendData, cityList) {
    var times = [...new Set(trendData.map(function (item) {
      return item.time.substring(11, 16);
    }))];

    var colors = cityList.map(function (_, index) {
      var hue = (index * (360 / cityList.length)) % 360;
      return 'hsl(' + hue + ', 75%, 65%)';
    });

    var seriesData = cityList.map(function (city, index) {
      return {
        name: city,
        type: 'line',
        smooth: true,
        showSymbol: false,
        data: trendData.filter(function (item) {
          return item.city === city;
        }).map(function (item) {
          return item.value;
        }),
        itemStyle: { color: colors[index] },
        lineStyle: { width: 2 }
      };
    });


    globalCityList = cityList;
    defaultTrendSelected = { '北京': true, '上海': true, '石家庄': true };
    cityList.forEach(function (city) {
      if (!defaultTrendSelected[city]) defaultTrendSelected[city] = false;
    });

    // 深拷贝一份给 ECharts 使用
    var initialSelected = JSON.parse(JSON.stringify(defaultTrendSelected));

    var option = {
      tooltip: {
        trigger: 'axis',
        axisPointer: { type: 'cross' }
      },
      legend: {
        type: 'scroll',
        top: '0%',
        right: '2%',
        textStyle: { color: textColor, fontSize: 12 },
        selected: initialSelected // 使用拷贝的对象
      },
      grid: { left: '3%', right: '5%', bottom: '5%', top: '20%', containLabel: true },
      xAxis: {
        type: 'category',
        data: times,
        axisLabel: { color: textColor },
        boundaryGap: false
      },
      yAxis: {
        type: 'value',
        axisLabel: { color: textColor },
        splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } }
      },
      series: seriesData
    };
    trendChart.setOption(option);
  }

  // ================== 中右：重点污染城市对比 (全量21城 + DataZoom) ==================
  function renderCompareChart(ranking, ratio) {
    // 1. 获取全部 21 个城市的数据（不再使用 slice(0,7)）
    var allCities = ranking.map(function (item) { return item.city; });
    var allAqis = ranking.map(function (item) { return item.avgAqi; });
    var allRatios = allCities.map(function (city) {
      var found = ratio.find(function (r) { return r.city === city; });
      return found ? found.goodRatio : 0;
    });

    var option = {
      tooltip: {
        trigger: 'axis',
        axisPointer: { type: 'shadow' }
      },
      legend: {
        top: '0%',
        textStyle: { color: textColor }
      },
      // 🌟 调整 grid，底部留出空间给 dataZoom 滑动条
      grid: {
        left: '5%',
        right: '5%',
        bottom: '20%', // 原来是 15%，现在增大给 dataZoom
        top: '15%',
        containLabel: true
      },
      // 🌟 新增 dataZoom 组件
      dataZoom: [
        {
          type: 'slider', // 底部滑动条
          show: true,
          start: 0,
          end: 40, // 默认展示前 40% 的城市（大约前 8 个），避免拥挤
          bottom: '4%',
          height: 20,
          borderColor: '#1a3652',
          fillerColor: 'rgba(0, 210, 255, 0.2)', // 选中区域的填充色
          handleStyle: { color: '#00d2ff' },
          textStyle: { color: textColor }
        },
        {
          type: 'inside', // 支持鼠标滚轮缩放
          start: 0,
          end: 40
        }
      ],
      xAxis: {
        type: 'category',
        data: allCities,
        axisLabel: {
          color: textColor,
          interval: 0, // 强制显示所有标签
          rotate: 30   // 倾斜 30 度防止城市名重叠
        }
      },
      yAxis: [
        {
          type: 'value',
          name: 'AQI',
          axisLabel: { color: textColor },
          splitLine: { show: false }
        },
        {
          type: 'value',
          name: '优良率%',
          max: 100,
          axisLabel: { color: textColor },
          splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } }
        }
      ],
      series: [
        {
          name: '平均 AQI',
          type: 'bar',
          data: allAqis,
          itemStyle: { color: '#ff4d4d' },
          barWidth: '35%' // 柱子稍微变细一点，适应更多数据
        },
        {
          name: '优良率 (%)',
          type: 'line',
          yAxisIndex: 1,
          data: allRatios,
          itemStyle: { color: '#00ff88' },
          smooth: true,
          symbolSize: 6 // 点稍微调小一点
        }
      ]
    };
    compareChart.setOption(option);
  }

  // ================== 中左：雷达图 ==================
  function initRadarSelect(cityList) {
    var select = document.getElementById('radarSelect');
    cityList.forEach(function (city) {
      var opt = document.createElement('option');
      opt.value = city;
      opt.innerText = city;
      select.appendChild(opt);
    });

    var defaultCity = cityList.includes('北京') ? '北京' : cityList[0];
    select.value = defaultCity;
    loadRadarData(defaultCity);

    select.addEventListener('change', function (e) {
      loadRadarData(e.target.value);
    });
  }

  function loadRadarData(city) {
    axios.get('/api/air/radar?city=' + city).then(function (res) {
      var radarData = res.data.filter(function (item) {
        return item.city !== 'AQI' && item.city !== 'CO';
      });

      var indicators = radarData.map(function (item) {
        return {
          name: item.city,
          max: Math.max(item.avgAqi * 1.5, 50)
        };
      });

      var option = {
        tooltip: {},
        radar: {
          indicator: indicators,
          center: ['50%', '55%'],
          radius: '65%',
          axisName: { color: textColor, fontSize: 13 },
          splitArea: {
            areaStyle: {
              color: ['rgba(0,210,255,0.02)', 'rgba(0,210,255,0.05)']
            }
          },
          splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
          axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } }
        },
        series: [
          {
            type: 'radar',
            data: [
              {
                value: radarData.map(function (item) { return item.avgAqi; }),
                name: city,
                itemStyle: { color: '#00d2ff' },
                areaStyle: { color: 'rgba(0,210,255,0.4)' }
              }
            ]
          }
        ]
      };
      radarChart.setOption(option, true);
    });
  }

  // ================== 左下：嵌套饼图 ==================
  function renderNestedPie(ratioData) {
    var sortedRatio = [...ratioData].sort(function (a, b) {
      return a.goodRatio - b.goodRatio;
    });

    var level1 = sortedRatio.filter(function (i) { return i.goodRatio < 50; });
    var level2 = sortedRatio.filter(function (i) { return i.goodRatio >= 50 && i.goodRatio <= 80; });
    var level3 = sortedRatio.filter(function (i) { return i.goodRatio > 80; });

    var innerData = [
      { name: '重度污染区', value: level1.length || 1 },
      { name: '中度污染区', value: level2.length || 1 },
      { name: '优良地区', value: level3.length || 1 }
    ];

    var outerData = [];
    level1.forEach(function (i) { outerData.push({ name: i.city, value: i.goodRatio }); });
    level2.forEach(function (i) { outerData.push({ name: i.city, value: i.goodRatio }); });
    level3.forEach(function (i) { outerData.push({ name: i.city, value: i.goodRatio }); });

    var option = {
      tooltip: { trigger: 'item', formatter: '{a} <br/>{b}: {c}%' },
      color: ['#ff4d4d', '#ffb703', '#00ff88', '#00d2ff', '#a29bfe', '#55efc4', '#fdcb6e', '#e17055', '#e84393', '#6c5ce7'],
      series: [
        {
          name: '污染等级',
          type: 'pie',
          selectedMode: false,
          radius: ['25%', '40%'],
          center: ['50%', '50%'],
          label: {
            position: 'inner',
            formatter: '{b}\n{d}%',
            color: '#fff',
            fontSize: 12,
            fontWeight: 'bold'
          },
          labelLine: { show: false },
          data: innerData,
          itemStyle: { borderColor: '#03081a', borderWidth: 2 }
        },
        {
          name: '城市优良率',
          type: 'pie',
          radius: ['48%', '65%'],
          center: ['50%', '50%'],
          labelLayout: { hideOverlap: true },
          label: {
            position: 'outside',
            color: '#fff',
            formatter: '{b}\n{c}%',
            fontSize: 12
          },
          labelLine: {
            length: 15,
            length2: 20,
            lineStyle: { color: textColor, width: 1 }
          },
          data: outerData,
          itemStyle: { borderColor: '#03081a', borderWidth: 2 }
        }
      ]
    };
    ratioChart.setOption(option);

    // 轮播高亮
    if (pieTimer) clearInterval(pieTimer);
    var currentIndex = -1;
    pieTimer = setInterval(function () {
      var dataLen = outerData.length;
      ratioChart.dispatchAction({ type: 'downplay', seriesIndex: 1 });
      currentIndex = (currentIndex + 1) % dataLen;
      ratioChart.dispatchAction({ type: 'highlight', seriesIndex: 1, dataIndex: currentIndex });
      ratioChart.dispatchAction({ type: 'showTip', seriesIndex: 1, dataIndex: currentIndex });
    }, 2500);
  }

  // ================== 右下：等级演化堆叠图 ==================
  function renderLevelChart(trendData) {
    var timeGroup = {};
    trendData.forEach(function (item) {
      var time = item.time.substring(11, 16);
      if (!timeGroup[time]) timeGroup[time] = [];
      timeGroup[time].push(item.value);
    });

    var times = Object.keys(timeGroup).sort();
    var levelData = {
      '优(≤50)': [],
      '良(51-100)': [],
      '轻度(101-150)': [],
      '中度(151-200)': [],
      '重度(>200)': []
    };

    times.forEach(function (t) {
      var counts = {
        '优(≤50)': 0,
        '良(51-100)': 0,
        '轻度(101-150)': 0,
        '中度(151-200)': 0,
        '重度(>200)': 0
      };
      timeGroup[t].forEach(function (aqi) {
        if (aqi <= 50) counts['优(≤50)']++;
        else if (aqi <= 100) counts['良(51-100)']++;
        else if (aqi <= 150) counts['轻度(101-150)']++;
        else if (aqi <= 200) counts['中度(151-200)']++;
        else counts['重度(>200)']++;
      });
      for (var key in counts) {
        levelData[key].push(counts[key]);
      }
    });

    var levelColors = ['#00ff88', '#ffb703', '#ff9800', '#ff4d4d', '#a20b0b'];
    var seriesData = Object.keys(levelData).map(function (key, index) {
      return {
        name: key,
        type: 'line',
        stack: 'Total',
        smooth: true,
        showSymbol: false,
        itemStyle: { color: levelColors[index] },
        areaStyle: { opacity: 0.8 },
        data: levelData[key]
      };
    });

    var option = {
      tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
      legend: {
        top: '0%',
        right: '2%',
        textStyle: { color: textColor },
        icon: 'rect',
        itemWidth: 12,
        itemHeight: 12
      },
      grid: { left: '3%', right: '4%', bottom: '5%', top: '15%', containLabel: true },
      xAxis: {
        type: 'category',
        data: times,
        axisLabel: { color: textColor },
        boundaryGap: false
      },
      yAxis: {
        type: 'value',
        name: '城市数量 (个)',
        nameTextStyle: { color: textColor },
        axisLabel: { color: textColor },
        splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } }
      },
      series: seriesData
    };
    levelChart.setOption(option);
  }

  // ================== 窗口自适应 ==================
  window.addEventListener('resize', function () {
    mapChart.resize();
    rankChart.resize();
    trendChart.resize();
    radarChart.resize();
    compareChart.resize();
    ratioChart.resize();
    levelChart.resize();
  });
</script>
</body>
