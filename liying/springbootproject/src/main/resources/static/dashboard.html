<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>多城市空气质量动态分析大屏</title>
  <!-- 更推荐本地引入 ECharts，但需要你在本地已经下载相关文件才可以调用 -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <!-- 引入 Axios 用于请求 -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #03081a;
      background-image: linear-gradient(rgba(0, 210, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 210, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      color: #fff;
      font-family: 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      padding-bottom: 30px;
      overflow-x: hidden;
    }
    /* 顶部标题栏 */
    .header {
      height: 80px;
      text-align: center;
      line-height: 80px;
      font-size: 32px;
      font-weight: bold;
      color: #00d2ff;
      text-shadow: 0 0 15px #00d2ff;
      background: rgba(0,0,0,0.5);
      border-bottom: 2px solid rgba(0,210,255,0.3);
      margin-bottom: 20px;
    }

    .container { max-width: 1800px; margin: 0 auto; padding: 0 20px; }

    /* 统一布局类 */
    .row { display: flex; gap: 20px; margin-bottom: 20px; }

    .chart-card {
      flex: 1;
      height: 420px;
      background: rgba(10, 20, 40, 0.7);
      border: 1px solid #1a3652;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.1) inset;
    }

    /* 卡片顶栏：左侧标题，右侧控件 */
    .card-header {
      height: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid rgba(26, 54, 82, 0.5);
      flex-shrink: 0;
    }
    .card-title { font-size: 18px; font-weight: bold; color: #fff; }

    /* 雷达图下拉框美化 */
    .tech-select {
      background: #0b1a30;
      color: #00d2ff;
      border: 1px solid #00d2ff;
      padding: 6px 30px 6px 12px;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      font-size: 14px;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300d2ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 14px;
    }
    .tech-select:hover { background-color: #1a3652; }

    /* 图表容器自适应 */
    .chart-container { flex: 1; width: 100%; }
  </style>
</head>
<body>
<div class="header">多城市空气质量动态分析大屏</div>

<div class="container">
  <!-- 第一行 -->
  <div class="row">
    <!-- 排名图 -->
    <div class="chart-card">
      <div class="card-header">
        <div class="card-title">各城市平均 AQI 排名</div>
      </div>
      <div id="rankChart" class="chart-container"></div>
    </div>

    <!-- 折线图 -->
    <div class="chart-card">
      <div class="card-header">
        <div class="card-title">多城市 24 小时 AQI 对比</div>
        <span style="font-size:12px; color:#88c0d0;">提示：点击上方图例可切换城市</span>
      </div>
      <div id="trendChart" class="chart-container"></div>
    </div>
  </div>

  <!-- 第二行 -->
  <div class="row">
    <!-- 雷达图 -->
    <div class="chart-card">
      <div class="card-header">
        <div class="card-title">污染物浓度特征雷达</div>
        <select id="radarSelect" class="tech-select"></select>
      </div>
      <div id="radarChart" class="chart-container"></div>
    </div>

    <!-- 柱线组合图 -->
    <div class="chart-card">
      <div class="card-header">
        <div class="card-title">重点污染城市 AQI 与优良率</div>
      </div>
      <div id="compareChart" class="chart-container"></div>
    </div>
  </div>

  <!-- 第三行：左饼图 + 右动态演化图 -->
  <div class="row">
    <!-- 左侧嵌套饼图 (占 4) -->
    <div class="chart-card" style="flex: 4; height: 500px;">
      <div class="card-header">
        <div class="card-title">21 城市优良时段占比嵌套分析</div>
        <span style="font-size:12px; color:#88c0d0;">自动轮播中...</span>
      </div>
      <div id="ratioChart" class="chart-container"></div>
    </div>

    <!-- 右侧堆叠演化图 (占 6) -->
    <div class="chart-card" style="flex: 6; height: 500px;">
      <div class="card-header">
        <div class="card-title">城市空气质量等级 24 小时演化趋势</div>
        <span style="font-size:12px; color:#88c0d0;">提示：面积越高，污染城市越多</span>
      </div>
      <div id="levelChart" class="chart-container"></div>
    </div>
  </div>
</div>

<script>
  // ================== 全局变量与初始化 ==================
  const rankChart = echarts.init(document.getElementById('rankChart'));
  const trendChart = echarts.init(document.getElementById('trendChart'));
  const radarChart = echarts.init(document.getElementById('radarChart'));
  const compareChart = echarts.init(document.getElementById('compareChart'));
  const ratioChart = echarts.init(document.getElementById('ratioChart'));
  const levelChart = echarts.init(document.getElementById('levelChart'));

  const textColor = '#88c0d0';
  let allCitiesStr = ""; // 缓存所有城市字符串
  let pieTimer = null; // 饼图轮播定时器

  // ================== 主请求流程 ==================
  axios.get('/api/air/dashboard').then(response => {
    const data = response.data;
    allCitiesStr = data.cityList.join(',');

    // 1. 渲染排名图
    renderRankChart(data.ranking);

    // 2. 渲染对比图
    renderCompareChart(data.ranking, data.ratio);

    // 3. 初始化交互组件 (雷达图下拉框)
    initRadarSelect(data.cityList);

    // 4. 获取全量趋势数据 (折线图 + 底部堆叠图)
    axios.get(`/api/air/trend?cities=${allCitiesStr}`).then(res => {
      const trendData = res.data;
      renderTrendChart(trendData, data.cityList);
      renderLevelChart(trendData); // 底部堆叠图
    });

    // 5. 渲染嵌套饼图（带动画轮播）
    renderNestedPie(data.ratio);

  }).catch(err => {
    console.error("数据加载失败", err);
    alert("数据加载失败，请按 F12 查看控制台");
  });

  // ================== 各图表渲染函数 ==================

  // 左上：城市排名
  function renderRankChart(ranking) {
    const cities = ranking.map(item => item.city).reverse();
    const values = ranking.map(item => item.avgAqi).reverse();

    rankChart.setOption({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      grid: { left: '3%', right: '8%', bottom: '5%', top: '5%', containLabel: true },
      xAxis: { type: 'value', axisLabel: { color: textColor }, splitLine: { show: false } },
      yAxis: { type: 'category', data: cities, axisLabel: { color: textColor, fontSize: 11 } },
      series: [{
        type: 'bar', data: values,
        itemStyle: {
          color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
            { offset: 0, color: '#00d2ff' },
            { offset: 1, color: '#ff4d4d' }
          ]),
          borderRadius: [0, 5, 5, 0]
        },
        label: { show: true, position: 'right', color: '#fff' }
      }]
    });
  }

  // 中上：多城市折线趋势
  function renderTrendChart(trendData, cityList) {
    const times = [...new Set(trendData.map(item => item.time.substring(11, 16)))];
    const colors = ['#ffb703', '#00ff88', '#ff4d4d', '#a29bfe', '#55efc4', '#fdcb6e', '#e17055', '#e84393', '#6c5ce7'];

    const seriesData = cityList.map((city, index) => ({
      name: city, type: 'line', smooth: true, showSymbol: false,
      data: trendData.filter(item => item.city === city).map(item => item.value),
      itemStyle: { color: colors[index % colors.length] },
      lineStyle: { width: 2 }
    }));

    // 默认只展示三个城市，其他隐藏
    const defaultSelected = { '北京': true, '上海': true, '石家庄': true };
    cityList.forEach(city => {
      if (!defaultSelected[city]) defaultSelected[city] = false;
    });

    trendChart.setOption({
      tooltip: { trigger: 'axis' },
      legend: {
        type: 'scroll', // 开启滚动图例
        top: '0%', right: '2%',
        textStyle: { color: textColor, fontSize: 12 },
        selected: defaultSelected
      },
      grid: { left: '3%', right: '5%', bottom: '5%', top: '20%', containLabel: true },
      xAxis: { type: 'category', data: times, axisLabel: { color: textColor } },
      yAxis: { type: 'value', axisLabel: { color: textColor }, splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } } },
      series: seriesData
    });
  }

  // 中右：重点污染城市对比
  function renderCompareChart(ranking, ratio) {
    const topCities = ranking.slice(0, 7).map(item => item.city);
    const topRatios = topCities.map(city => ratio.find(r => r.city === city)?.goodRatio || 0);

    compareChart.setOption({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      legend: { bottom: '0%', textStyle: { color: textColor } },
      grid: { left: '5%', right: '5%', bottom: '15%', top: '15%', containLabel: true },
      xAxis: { type: 'category', data: topCities, axisLabel: { color: textColor } },
      yAxis: [
        { type: 'value', name: 'AQI', axisLabel: { color: textColor }, splitLine: { show: false } },
        { type: 'value', name: '优良率%', max: 100, axisLabel: { color: textColor }, splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } } }
      ],
      series: [
        { name: '平均 AQI', type: 'bar', data: ranking.slice(0, 7).map(i => i.avgAqi), itemStyle: { color: '#ff4d4d' }, barWidth: '25%' },
        { name: '优良率 (%)', type: 'line', yAxisIndex: 1, data: topRatios, itemStyle: { color: '#00ff88' }, smooth: true, symbolSize: 8 }
      ]
    });
  }

  // 中左：雷达图交互初始化
  function initRadarSelect(cityList) {
    const select = document.getElementById('radarSelect');
    cityList.forEach(city => {
      const opt = document.createElement('option');
      opt.value = city; opt.innerText = city;
      select.appendChild(opt);
    });

    const defaultCity = cityList.includes('北京') ? '北京' : cityList[0];
    select.value = defaultCity;
    loadRadarData(defaultCity);

    // 下拉框切换事件
    select.addEventListener('change', (e) => loadRadarData(e.target.value));
  }

  function loadRadarData(city) {
    axios.get(`/api/air/radar?city=${city}`).then(res => {
      // 过滤掉不需要展示在雷达图里的指标（如AQI和CO）
      const radarData = res.data.filter(item => item.city !== 'AQI' && item.city !== 'CO');

      // 动态计算最大值边界，让图形更舒展
      const indicators = radarData.map(item => ({
        name: item.city,
        max: Math.max(item.avgAqi * 1.5, 50)
      }));

      radarChart.setOption({
        tooltip: {},
        radar: {
          indicator: indicators,
          center: ['50%', '55%'],
          radius: '65%',
          axisName: { color: textColor, fontSize: 13 },
          splitArea: { areaStyle: { color: ['rgba(0,210,255,0.02)', 'rgba(0,210,255,0.05)'] } },
          splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
          axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } }
        },
        series: [{
          type: 'radar',
          data: [{
            value: radarData.map(item => item.avgAqi),
            name: city,
            itemStyle: { color: '#00d2ff' },
            areaStyle: { color: 'rgba(0,210,255,0.4)' }
          }]
        }]
      }, true); // true 表示不合并历史配置，直接重绘
    });
  }

  // 左下：嵌套饼图（带自动轮播高亮）
  function renderNestedPie(ratioData) {
    const sortedRatio = [...ratioData].sort((a, b) => a.goodRatio - b.goodRatio);
    const level1 = sortedRatio.filter(i => i.goodRatio < 50);
    const level2 = sortedRatio.filter(i => i.goodRatio >= 50 && i.goodRatio <= 80);
    const level3 = sortedRatio.filter(i => i.goodRatio > 80);

    const innerData = [
      { name: '重度污染区', value: level1.length || 1 },
      { name: '中度污染区', value: level2.length || 1 },
      { name: '优良地区', value: level3.length || 1 }
    ];
    const outerData = [
      ...level1.map(i => ({ name: i.city, value: i.goodRatio })),
      ...level2.map(i => ({ name: i.city, value: i.goodRatio })),
      ...level3.map(i => ({ name: i.city, value: i.goodRatio }))
    ];

    ratioChart.setOption({
      tooltip: { trigger: 'item', formatter: '{a} <br/>{b}: {c}%' },
      color: ['#ff4d4d', '#ffb703', '#00ff88', '#00d2ff', '#a29bfe', '#55efc4', '#fdcb6e', '#e17055', '#e84393', '#6c5ce7'],
      series: [
        {
          name: '污染等级', type: 'pie', selectedMode: false,
          radius: ['25%', '40%'], center: ['50%', '50%'],
          label: { position: 'inner', formatter: '{b}\n{d}%', color: '#fff', fontSize: 12, fontWeight: 'bold' },
          labelLine: { show: false },
          data: innerData,
          itemStyle: { borderColor: '#03081a', borderWidth: 2 }
        },
        {
          name: '城市优良率', type: 'pie',
          radius: ['48%', '65%'], center: ['50%', '50%'],
          labelLayout: { hideOverlap: true },
          label: { position: 'outside', color: '#fff', formatter: '{b}\n{c}%', fontSize: 12 },
          labelLine: { length: 15, length2: 20, lineStyle: { color: textColor, width: 1 } },
          data: outerData,
          itemStyle: { borderColor: '#03081a', borderWidth: 2 }
        }
      ]
    });

    // 🌟 轮播高亮特效
    if (pieTimer) clearInterval(pieTimer);
    let currentIndex = -1;
    pieTimer = setInterval(() => {
      const dataLen = outerData.length;
      ratioChart.dispatchAction({ type: 'downplay', seriesIndex: 1 });
      currentIndex = (currentIndex + 1) % dataLen;
      ratioChart.dispatchAction({ type: 'highlight', seriesIndex: 1, dataIndex: currentIndex });
      ratioChart.dispatchAction({ type: 'showTip', seriesIndex: 1, dataIndex: currentIndex });
    }, 2500);
  }

  // 右下：等级演化堆叠图
  function renderLevelChart(trendData) {
    // 整理数据：按时间分组
    const timeGroup = {};
    trendData.forEach(item => {
      const time = item.time.substring(11, 16);
      if (!timeGroup[time]) timeGroup[time] = [];
      timeGroup[time].push(item.value);
    });

    // 提取去重排序后的时间数组
    const times = Object.keys(timeGroup).sort();

    // 定义统计容器
    const levelData = { '优(≤50)': [], '良(51-100)': [], '轻度(101-150)': [], '中度(151-200)': [], '重度(>200)': [] };

    // 循环每个时间点，统计处于各等级的城市数量
    times.forEach(t => {
      let counts = { '优(≤50)': 0, '良(51-100)': 0, '轻度(101-150)': 0, '中度(151-200)': 0, '重度(>200)': 0 };
      timeGroup[t].forEach(aqi => {
        if (aqi <= 50) counts['优(≤50)']++;
        else if (aqi <= 100) counts['良(51-100)']++;
        else if (aqi <= 150) counts['轻度(101-150)']++;
        else if (aqi <= 200) counts['中度(151-200)']++;
        else counts['重度(>200)']++;
      });
      for (let key in counts) levelData[key].push(counts[key]);
    });

    const levelColors = ['#00ff88', '#ffb703', '#ff9800', '#ff4d4d', '#a20b0b'];

    const seriesData = Object.keys(levelData).map((key, index) => ({
      name: key,
      type: 'line',
      stack: 'Total', // 开启堆叠
      smooth: true,
      showSymbol: false,
      itemStyle: { color: levelColors[index] },
      areaStyle: { opacity: 0.8 }, // 区域填充
      data: levelData[key]
    }));

    levelChart.setOption({
      tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
      legend: { top: '0%', right: '2%', textStyle: { color: textColor }, icon: 'rect', itemWidth: 12, itemHeight: 12 },
      grid: { left: '3%', right: '4%', bottom: '5%', top: '15%', containLabel: true },
      xAxis: { type: 'category', data: times, axisLabel: { color: textColor }, boundaryGap: false },
      yAxis: { type: 'value', name: '城市数量 (个)', nameTextStyle: { color: textColor }, axisLabel: { color: textColor }, splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } } },
      series: seriesData
    });
  }

  // ================== 窗口自适应 ==================
  window.addEventListener('resize', () => {
    rankChart.resize(); trendChart.resize(); radarChart.resize();
    compareChart.resize(); ratioChart.resize(); levelChart.resize();
  });
</script>
</body>
</html>
