<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品管理列表</title>
    <link th:href="@{/bootstrap5/css/bootstrap.min.css}" rel="stylesheet">

    <style>
        .product-img {
            height: 220px;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid px-5 mt-5">
    <h2 class="mb-4 fw-bold">商品管理列表</h2>

    <div class="row g-4">
        <div class="col-12 col-md-6 col-lg-3" th:each="product : ${productList}">
            <div class="card h-100 shadow-sm border-0">
                <img th:src="${product.proimg}" class="card-img-top product-img" alt="商品图片">

                <div class="card-body d-flex flex-column">
                    <h5 class="card-title text-truncate fs-6" th:text="${product.proname}" th:title="${product.proname}">商品名称</h5>
                    <p class="card-text text-muted small text-truncate mb-2" th:text="${product.storename}">店铺名称</p>
                    <p class="card-text text-danger fw-bold fs-5 mt-auto mb-3">
                        ￥<span th:text="${product.proprice}">0.00</span>
                    </p>
                    <button class="btn btn-outline-danger btn-sm w-100">查看详情</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/bootstrap5/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
