<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品管理（JPA版）</title>
    <link rel="stylesheet" th:href="@{/bootstrap5/css/bootstrap.min.css}">
    <style>
        .product-img { width: 56px; height: 56px; object-fit: contain; border: 1px solid #eee; border-radius: 4px; }
        .product-name { max-width: 320px; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid py-4 px-5">
    <h4 class="mb-3">商品管理（JPA版）</h4>

    <!-- 查询表单：提交到JPA版本的控制器 -->
    <div class="card mb-3">
        <div class="card-body">
            <form class="row g-3 align-items-end" method="get" th:action="@{/jpa/product/list}">
                <div class="col-md-4">
                    <label class="form-label" for="name">商品名称</label>
                    <input type="text" class="form-control" id="name" name="name" th:value="${name}" placeholder="请输入商品名称关键字">
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="minPrice">最低价格</label>
                    <input type="number" step="0.01" class="form-control" id="minPrice" name="minPrice" th:value="${minPrice}">
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="maxPrice">最高价格</label>
                    <input type="number" step="0.01" class="form-control" id="maxPrice" name="maxPrice" th:value="${maxPrice}">
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="categoryId">商品分类</label>
                    <select class="form-select" id="categoryId" name="categoryId">
                        <option value="">全部分类</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                                th:selected="${c.id == categoryId}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary">查询</button>
                    <a class="btn btn-outline-secondary" th:href="@{/jpa/product/list}">重置</a>
                </div>
            </form>
        </div>
    </div>

    <div class="mb-2 text-muted">共 <b th:text="${#lists.size(products)}">0</b> 件商品</div>
    <table class="table table-hover table-bordered bg-white align-middle">
        <thead class="table-light">
        <tr>
            <th>ID</th><th>图片</th><th>商品名称</th><th>品牌</th><th>分类</th>
            <th>价格</th><th>库存</th><th>销量</th><th>状态</th><th>上架时间</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.id}"></td>
            <td><img class="product-img" th:src="${p.imageUrl}" alt=""></td>
            <td class="product-name" th:text="${p.name}"></td>
            <td th:text="${p.brand}"></td>
            <td th:text="${p.category != null ? p.category.name : ''}"></td>
            <td class="text-danger fw-bold" th:text="'￥' + ${#numbers.formatDecimal(p.price, 1, 2)}"></td>
            <td th:text="${p.stock}"></td>
            <td th:text="${p.sales}"></td>
            <td>
                <span th:if="${p.status == 1}" class="badge bg-success">上架</span>
                <span th:if="${p.status == 0}" class="badge bg-secondary">下架</span>
            </td>
            <td th:text="${#dates.format(p.createTime, 'yyyy-MM-dd')}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(products)}">
            <td colspan="10" class="text-center text-muted">没有符合条件的商品</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
