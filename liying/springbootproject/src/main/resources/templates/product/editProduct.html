<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>编辑商品</title>
    <link th:href="@{/bootstrap5/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h5 class="mb-0">编辑商品信息</h5>
        </div>
        <div class="card-body">
            <!-- 表单提交到 Controller 的 update 接口 -->
            <form th:action="@{/product/update}" method="post">
                <!-- 隐藏域：必须传 ID，否则不知道修改的是哪一个商品 -->
                <input type="hidden" name="id" th:value="${product.id}">

                <div class="mb-3">
                    <label class="form-label">商品名称</label>
                    <input type="text" class="form-control" name="name" th:value="${product.name}">
                </div>
                <div class="mb-3">
                    <label class="form-label">价格</label>
                    <input type="number" step="0.01" class="form-control" name="price" th:value="${product.price}">
                </div>
                <div class="mb-3">
                    <label class="form-label">库存</label>
                    <input type="number" class="form-control" name="stock" th:value="${product.stock}">
                </div>
                <div class="mb-3">
                    <label class="form-label">状态</label>
                    <select class="form-select" name="status">
                        <option value="1" th:selected="${product.status == 1}">上架</option>
                        <option value="0" th:selected="${product.status == 0}">下架</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">保存修改</button>
                <a th:href="@{/product/list}" class="btn btn-secondary">取消</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
